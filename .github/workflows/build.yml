name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Use signing key from secrets (optional - falls back to app/signing)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "MM_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Test and build
        env:
          MM_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          MM_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          MM_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MemoryMatch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MemoryMatch-apk
          path: MemoryMatch.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Memory Match 1.0.${{ github.run_number }}
          body: "Install **MemoryMatch.apk** below. Built from ${{ github.sha }}."
          files: MemoryMatch.apk
          make_latest: true
